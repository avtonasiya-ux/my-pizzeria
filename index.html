<!doctype html>
<title>My Pizzeria</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
/* Maket: butun ekran oʻyin maydoni (yuqoridan koʻrinish), ustida pul, maslahat va yaxshilash tugmasi.
   Yagona koʻrinish ataylab tanlangan: rayhon yashili, pomidor qizili, pishloq sarigʻi. Shriftlar tizimdan, internet kerak emas. */
:root {
  color-scheme: dark;
  --rayhon-900: #123c2c;
  --rayhon-700: #1f6b4a;
  --rayhon-400: #49b37c;
  --pomidor: #d9412f;
  --pishloq: #ffc83d;
  --xamir: #fff4dc;
  --font: "Trebuchet MS", "Segoe UI", system-ui, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--rayhon-900); color: var(--xamir); font: 15px/1.35 var(--font); user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--pishloq); outline-offset: 2px; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 0; right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; pointer-events: none; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.money { background: linear-gradient(180deg, #1f6b4a, #0e3526); border: 3px solid var(--pishloq); border-radius: 999px; padding: 4px 18px 4px 6px; display: flex; align-items: center; gap: 8px; font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; box-shadow: 0 4px 0 #0a261b, 0 8px 18px rgba(0, 0, 0, .35); text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.money i { width: 30px; height: 30px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--pishloq) 45%, #c98a12); box-shadow: inset 0 0 0 3px #e0a21e, 0 2px 0 #8a5c08; }
.place { display: block; margin-top: 4px; padding-left: 8px; font-size: 12px; text-shadow: 0 1px 2px #000; }
.btns { display: flex; gap: 8px; pointer-events: auto; }
.chip { background: linear-gradient(180deg, #f0604c, var(--pomidor)); border: 0; border-radius: 14px; padding: 0 16px; min-height: 46px; font-weight: 800; box-shadow: 0 4px 0 #8f2518, 0 8px 16px rgba(0, 0, 0, .3); text-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 #8f2518; }
.chip.soft { background: linear-gradient(180deg, #2a8a60, var(--rayhon-700)); box-shadow: 0 4px 0 var(--rayhon-900), 0 8px 16px rgba(0, 0, 0, .3); min-width: 46px; padding: 0 12px; }
#hint { justify-self: center; max-width: min(520px, 100%); background: rgba(14, 53, 38, .88); border: 2px solid rgba(255, 200, 61, .55); border-radius: 999px; padding: 6px 18px; text-align: center; font-weight: 700; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); backdrop-filter: blur(4px); }
#stick { position: fixed; z-index: 4; left: 0; top: 0; width: 96px; height: 96px; border-radius: 50%; background: rgba(255, 244, 220, .32); pointer-events: none; }
#knob { position: absolute; left: 24px; top: 24px; width: 48px; height: 48px; border-radius: 50%; background: var(--rayhon-700); border: 3px solid var(--xamir); }
#toast { position: fixed; z-index: 6; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); text-align: center; font-size: 26px; font-weight: 700; color: var(--pishloq); text-shadow: 0 2px 0 var(--rayhon-900), 0 0 8px var(--rayhon-900); pointer-events: none; }
.shade { position: fixed; z-index: 10; inset: 0; display: grid; place-items: end center; background: rgba(8, 26, 19, .6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.sheet { width: min(460px, 100%); max-height: 84%; overflow-y: auto; background: var(--rayhon-900); border: 2px solid var(--rayhon-400); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.sheet h2 { margin: 0; font-size: 22px; color: var(--pishloq); }
.sheet p { margin: 0; }
.up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 14px; background: linear-gradient(180deg, #2a8a60, var(--rayhon-700)); padding: 10px 14px; min-height: 60px; box-shadow: 0 3px 0 #0e3526; }
.up:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0e3526; }
.up:disabled { opacity: .55; cursor: default; }
.up b { font-size: 16px; }
.up small { grid-column: 1; opacity: .9; }
.up span { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; color: var(--pishloq); font-variant-numeric: tabular-nums; }
.big { border: 0; border-radius: 12px; background: var(--pishloq); color: var(--rayhon-900); font-weight: 700; min-height: 46px; }
.line { background: none; border: 0; color: var(--xamir); text-decoration: underline; padding: 8px; justify-self: center; opacity: .8; }
.line.warn { color: var(--pishloq); opacity: 1; font-weight: 700; }
.tabs, .bulk { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.tab { border: 0; border-radius: 12px; min-height: 44px; font-weight: 800; background: #0e3526; color: var(--xamir); opacity: .8; }
.tab.on { background: var(--pishloq); color: var(--rayhon-900); opacity: 1; }
#up-info { font-size: 13px; }
.rep { height: 7px; border-radius: 4px; background: #0e3526; overflow: hidden; }
.rep i { display: block; height: 100%; width: 0; background: var(--rayhon-400); }
.up em { font-style: normal; font-size: 13px; color: var(--pishloq); margin-left: 4px; }
#goal { font-weight: 700; color: var(--pishloq); margin-top: 1px; }
#rush { justify-self: center; background: var(--pomidor); border-radius: 999px; padding: 4px 18px; font-weight: 800; box-shadow: 0 4px 0 #8f2518; }
.cover { place-items: center; background: rgba(8, 26, 19, .55); z-index: 12; }
.center { text-align: center; justify-items: center; padding: 26px 20px; }
.center h1 { margin: 0; font-size: clamp(36px, 9vw, 54px); line-height: 1.05; color: var(--pishloq); text-shadow: 0 4px 0 #8f2518; }
.center .big { width: 100%; font-size: 22px; min-height: 58px; }
.center .small { font-size: 13px; opacity: .85; }
</style>

<canvas id="view" aria-label="Pizzeria. Drag or use WASD to walk."></canvas>

<div id="stick" hidden><i id="knob"></i></div>
<div id="toast" hidden></div>

<div class="hud">
  <div class="row">
    <div>
      <div class="money"><i></i><span id="money">0</span></div>
      <span class="place" id="place"></span>
      <span class="place" id="goal"></span>
    </div>
    <div class="btns">
      <button class="chip soft" id="sound" type="button" aria-label="Sound">Sound</button>
      <button class="chip soft" id="ad" type="button" hidden>x2 Ad</button>
      <button class="chip" id="open-up" type="button">Upgrades</button>
    </div>
  </div>
  <div id="rush" hidden></div>
  <div id="hint"></div>
</div>

<div class="shade cover" id="start">
  <div class="sheet center">
    <h1>My Pizzeria</h1>
    <p>Bake pizzas, serve hungry guests, hire staff and grow your shop into a worldwide chain.</p>
    <button class="big" id="play" type="button">Play</button>
    <p class="small">Drag or use WASD to walk. Works without internet.</p>
  </div>
</div>

<div class="shade" id="daily" hidden>
  <div class="sheet" role="dialog" aria-labelledby="daily-h">
    <h2 id="daily-h">Daily reward</h2>
    <p id="daily-t"></p>
    <button class="big" id="daily-b" type="button">Collect</button>
  </div>
</div>

<div class="shade" id="up-sheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="up-h">
    <h2 id="up-h">Upgrades</h2>
    <p id="up-info"></p>
    <div class="rep"><i id="up-rep"></i></div>
    <div class="tabs">
      <button class="tab" id="tab-coins" type="button">Coins</button>
      <button class="tab" id="tab-stars" type="button">Stars</button>
      <button class="tab" id="tab-goals" type="button">Goals</button>
      <button class="tab" id="tab-stats" type="button">Stats</button>
    </div>
    <div class="bulk" id="bulk">
      <button class="tab" id="bulk-1" type="button">x1</button>
      <button class="tab" id="bulk-10" type="button">x10</button>
      <button class="tab" id="bulk-max" type="button">Max</button>
    </div>
    <div id="up-list" style="display:grid;gap:8px"></div>
    <button class="big" id="close-up" type="button">Close</button>
    <button class="line" id="wipe" type="button">Start over</button>
  </div>
</div>

<div class="shade" id="away" hidden>
  <div class="sheet" role="dialog" aria-labelledby="away-h">
    <h2 id="away-h">Your staff kept working</h2>
    <p id="away-t"></p>
    <button class="big" id="away-b" type="button">Collect coins</button>
  </div>
</div>

<script src="https://www.youtube.com/game_api/v1"></script>
<script src="three.min.js"></script>
<script id="core">
const CITIES = ['Tashkent', 'Samarkand', 'Bukhara', 'Khiva', 'Fergana', 'Istanbul', 'Dubai', 'Rome', 'Paris', 'London', 'Tokyo', 'New York'];
const RW = 1000, TOP = 200, BOT = 1200, KY = 500;
const HALL = { y1: 640, w: 640, gate1: 820, gate2: 1020 };
const OVEN_X = [150, 350, 650, 850], OVEN_Y = 250, OVEN_SPOT = 340;
const BIN = { x: 920, y: 440 }, BIN_ZONE = { x: 920, y: 520 };
const KASSA = { x: 500, y: 420 }, COUNTER_Z = 468, HEAD_Y = 520, DOOR = { x: 500, y: 1205 };
const TABLES = [[190, 640], [810, 640], [190, 860], [810, 860], [190, 1080], [810, 1080],
  [1200, 780], [1460, 780], [1200, 1060], [1460, 1060],
  [-200, 780], [-460, 780], [-200, 1060], [-460, 1060]];
const roomOf = i => i < 6 ? 'A' : i < 10 ? 'B' : 'C';
const GATE = { B: { x: RW, y: 920 }, C: { x: 0, y: 920 } };
const STEPS = [
  { id: 'oven0', kind: 'oven', i: 0, cost: 30, name: 'Oven' },
  { id: 'kassa', kind: 'kassa', cost: 30, name: 'Register' },
  { id: 'table0', kind: 'table', i: 0, cost: 20, name: 'Table' },
  { id: 'table1', kind: 'table', i: 1, cost: 40, name: 'Table' },
  { id: 'table2', kind: 'table', i: 2, cost: 70, name: 'Table' },
  { id: 'runner0', kind: 'staff', role: 'runner', x: 300, y: 420, cost: 120, name: 'Helper' },
  { id: 'table3', kind: 'table', i: 3, cost: 120, name: 'Table' },
  { id: 'oven1', kind: 'oven', i: 1, cost: 180, name: 'Oven' },
  { id: 'kassir', kind: 'staff', role: 'kassir', x: 700, y: 420, cost: 260, name: 'Cashier' },
  { id: 'soda', kind: 'soda', x: 660, y: 470, cost: 240, name: 'Soda Machine' },
  { id: 'table4', kind: 'table', i: 4, cost: 220, name: 'Table' },
  { id: 'table5', kind: 'table', i: 5, cost: 320, name: 'Table' },
  { id: 'cleaner', kind: 'staff', role: 'cleaner', x: 70, y: 560, cost: 450, name: 'Cleaner' },
  { id: 'oven2', kind: 'oven', i: 2, cost: 600, name: 'Oven' },
  { id: 'manager', kind: 'staff', role: 'manager', x: 930, y: 640, cost: 900, name: 'Manager' },
  { id: 'hallB', kind: 'hall', x: RW - 52, y: 920, cost: 1500, name: 'Second Hall' },
  { id: 'table6', kind: 'table', i: 6, cost: 700, name: 'Table', needs: 'hallB' },
  { id: 'table7', kind: 'table', i: 7, cost: 900, name: 'Table', needs: 'hallB' },
  { id: 'runner1', kind: 'staff', role: 'runner', x: 300, y: 420, cost: 1200, name: 'Helper' },
  { id: 'table8', kind: 'table', i: 8, cost: 1300, name: 'Table', needs: 'hallB' },
  { id: 'table9', kind: 'table', i: 9, cost: 1700, name: 'Table', needs: 'hallB' },
  { id: 'oven3', kind: 'oven', i: 3, cost: 2500, name: 'Oven' },
  { id: 'hallC', kind: 'hall', x: 52, y: 920, cost: 6000, name: 'Summer Terrace' },
  { id: 'table10', kind: 'table', i: 10, cost: 3000, name: 'Table', needs: 'hallC' },
  { id: 'table11', kind: 'table', i: 11, cost: 3800, name: 'Table', needs: 'hallC' },
  { id: 'runner2', kind: 'staff', role: 'runner', x: 300, y: 420, cost: 5000, name: 'Helper' },
  { id: 'table12', kind: 'table', i: 12, cost: 5000, name: 'Table', needs: 'hallC' },
  { id: 'table13', kind: 'table', i: 13, cost: 6500, name: 'Table', needs: 'hallC' },
  { id: 'filial', kind: 'filial', x: 330, y: 960, cost: 20000, name: 'New Branch' }
];
/* Hamma yaxshilashlar cheksiz: narx oshaveradi, taʼsir ham oshaveradi */
const UPS = [
  { id: 'speed', name: 'Running Shoes', note: lv => 'You walk faster', base: 35, rate: 1.6 },
  { id: 'carry', name: 'Strong Arms', note: lv => 'You carry ' + carryMax() + ' at once', base: 40, rate: 1.65 },
  { id: 'staff', name: 'Helper Speed', note: lv => 'Helpers walk faster', base: 150, rate: 1.65 },
  { id: 'load', name: 'Helper Trolleys', note: lv => 'Helpers carry ' + helperLoad() + ' at once', base: 170, rate: 1.65 },
  { id: 'cspeed', name: 'Cleaner Speed', note: lv => 'Cleaners walk faster', base: 200, rate: 1.65 },
  { id: 'cload', name: 'Cleaner Cart', note: lv => 'Cleaners carry ' + cleanerLoad() + ' dishes', base: 220, rate: 1.65 },
  { id: 'price', name: 'Better Recipe', note: lv => 'Pizza price +22% each level', base: 150, rate: 1.75 },
  { id: 'tips', name: 'Bigger Tips', note: lv => 'Tips are ' + (30 + lv * 10) + '% of the price', base: 90, rate: 1.65 },
  { id: 'oven', name: 'Hotter Ovens', note: lv => 'One pizza every ' + ovenTime().toFixed(2) + 's', base: 100, rate: 1.7 },
  { id: 'cap', name: 'Bigger Trays', note: lv => 'Ovens hold ' + ovenCap() + ' pizzas', base: 70, rate: 1.55 },
  { id: 'fame', name: 'Fame', note: lv => 'Customers arrive every ' + spawnTime().toFixed(2) + 's', base: 200, rate: 1.75 },
  { id: 'service', name: 'Fast Service', note: lv => 'Cashiers serve faster, customers eat faster', base: 170, rate: 1.7 }
];
const PERKS = [
  { id: 'income', name: 'Golden Sauce', note: lv => 'All income +25% each level', base: 1, rate: 1.5 },
  { id: 'start', name: 'Investors', note: lv => 'New branches start with more coins', base: 1, rate: 1.4 },
  { id: 'build', name: 'Cheap Builders', note: lv => 'Everything you build costs ' + Math.round(buildMult() * 100) + '%', base: 2, rate: 1.5 },
  { id: 'night', name: 'Night Shift', note: lv => 'Earn while away for ' + awayHours() + ' hours', base: 1, rate: 1.45 }
];
const P_R = 16;

function freshSave() {
  return { v: 1, money: 90, bought: {}, paid: {}, up: {}, perks: {}, stars: 0, repLv: 0, repXp: 0, filial: 0, served: 0, missionsDone: 0, mission: null, ach: {}, daily: { day: '', streak: 0 }, total: { sold: 0, earned: 0, vip: 0, bags: 0, rush: 0, playSec: 0 }, last: Date.now() };
}
const G = { S: freshSave(), input: null, onCoin: null, onBuy: null };

function rebuild(keep) {
  const S = G.S, old = keep ? G : null;
  G.p = old ? G.p : { x: RW / 2, y: BOT - 60, carry: 0, trash: 0, dir: 0, walk: 0, zoneT: 0 };
  G.ovens = OVEN_X.map((x, i) => S.bought['oven' + i] ? (old && old.ovens[i].on ? old.ovens[i] : { on: true, x, stack: 1, t: 0 }) : { on: false, x, stack: 0, t: 0 });
  G.tables = TABLES.map((t, i) => {
    const on = !!S.bought['table' + i];
    return old && old.tables[i].on === on ? old.tables[i] : { on, x: t[0], y: t[1], busy: false, dirty: false, money: 0, clean: 0 };
  });
  G.shelf = old ? G.shelf : 0;
  G.till = old ? G.till : 0;
  G.customers = old ? G.customers : [];
  G.spawnT = old ? G.spawnT : 2;
  G.serveT = 0;
  if (!old) { G.rush = 0; G.rushT = 120; G.bag = null; G.bagT = 30; G.achT = 1; }
  const staff = [];
  STEPS.forEach(s => {
    if (s.kind !== 'staff' || !S.bought[s.id]) return;
    const had = old && G.staff.find(w => w.id === s.id);
    staff.push(had || { id: s.id, role: s.role, x: s.x, y: s.y, carry: 0, trash: 0, walk: 0, target: null, clean: 0, going: false });
  });
  G.staff = staff;
}
const has = id => !!G.S.bought[id];
const lv = id => G.S.up[id] || 0;
const perk = id => G.S.perks[id] || 0;
const carryMax = () => 1 + lv('carry');
const walkSpeed = () => 170 * (1 + 3.4 * (1 - Math.pow(0.93, lv('speed'))));
const ovenTime = () => Math.max(0.3, 4.5 * Math.pow(0.88, lv('oven')));
const ovenCap = () => 6 + lv('cap') * 3;
const helperLoad = () => 1 + lv('load');
const cleanerLoad = () => 1 + lv('cload');
const staffSpeed = () => 130 * (1 + 4 * (1 - Math.pow(0.93, lv('staff'))));
const cleanerSpeed = () => 130 * (1 + 4 * (1 - Math.pow(0.93, lv('cspeed'))));
const serveTime = () => Math.max(0.1, 0.7 * Math.pow(0.92, lv('service')));
const eatTime = () => Math.max(1.2, 5 * Math.pow(0.94, lv('service')));
const buildMult = () => Math.max(0.1, Math.pow(0.95, perk('build')));
const awayHours = () => 8 + perk('night');
const repNeed = n => 20 * Math.pow(1.16, n);
const incomeMult = () => Math.pow(1.6, G.S.filial) * (1 + 0.03 * G.S.repLv) * Math.pow(1.25, perk('income'));
const pizzaPrice = () => 8 * Math.pow(1.22, lv('price')) * incomeMult() * (has('soda') ? 1.4 : 1) * (G.rush > 0 ? 2 : 1) * (G.boost > 0 ? 2 : 1);
const tipShare = () => 0.3 + lv('tips') * 0.1;
const tableCount = () => G.tables.filter(t => t.on).length;
const spawnTime = () => Math.max(0.35, Math.max(0.9, 7 - 0.5 * tableCount()) * Math.pow(0.93, lv('fame'))) * (G.rush > 0 ? 0.5 : 1);
const upCost = (u, level) => Math.ceil(u.base * Math.pow(u.rate, level === undefined ? (UPS.includes(u) ? lv(u.id) : perk(u.id)) : level));
const stepCost = s => Math.ceil(s.cost * Math.pow(1.3, G.S.filial) * buildMult());
const starGain = () => 1 + Math.floor(G.S.filial / 2);
const cityName = () => CITIES[G.S.filial % CITIES.length] + (G.S.filial >= CITIES.length ? ' ' + (Math.floor(G.S.filial / CITIES.length) + 1) : '');
function buyLevels(u, count) {
  const isUp = UPS.includes(u), box = isUp ? G.S.up : G.S.perks, wallet = isUp ? 'money' : 'stars';
  let n = 0;
  while (n < count) {
    const c = upCost(u);
    if (G.S[wallet] < c) break;
    G.S[wallet] -= c; box[u.id] = (box[u.id] || 0) + 1; n++;
  }
  return n;
}

function padPos(s) {
  if (s.kind === 'oven') return { x: OVEN_X[s.i], y: OVEN_Y + 8 };
  if (s.kind === 'kassa') return KASSA;
  if (s.kind === 'table') return { x: TABLES[s.i][0], y: TABLES[s.i][1] };
  return s;
}
function activeSteps() {
  const list = STEPS.filter(s => !G.S.bought[s.id] && (!s.needs || G.S.bought[s.needs]));
  // Birinchi stolgacha faqat bitta joy: pul ikki joyga boʻlinib, oʻyin qotib qolmasin
  const single = !G.S.bought.table0 || (list[0] && list[0].kind === 'filial');
  return list.slice(0, single ? 1 : 2);
}
function solids() {
  const r = [[BIN.x - 28, BIN.y - 28, BIN.x + 28, BIN.y + 28]];
  if (has('soda')) r.push([630, 446, 690, 494]);
  G.ovens.forEach(o => { if (o.on) r.push([o.x - 52, OVEN_Y - 39, o.x + 52, OVEN_Y + 64]); });
  if (has('kassa')) r.push([422, COUNTER_Z - 26, 578, COUNTER_Z + 26]);
  G.tables.forEach(t => { if (t.on) r.push([t.x - 44, t.y - 30, t.x + 44, t.y + 30]); });
  return r;
}
function walkable() {
  const r = [[18, TOP + 18, RW - 18, BOT - 18]], y1 = HALL.y1 + 18, y2 = BOT - 18;
  if (has('hallB')) r.push([RW - 30, HALL.gate1, RW + 40, HALL.gate2], [RW + 18, y1, RW + HALL.w - 18, y2]);
  if (has('hallC')) r.push([-40, HALL.gate1, 30, HALL.gate2], [-HALL.w + 18, y1, -18, y2]);
  return r;
}
function free(x, y, floors, blocks) {
  if (!floors.some(a => x >= a[0] && x <= a[2] && y >= a[1] && y <= a[3])) return false;
  return !blocks.some(b => x > b[0] - P_R && x < b[2] + P_R && y > b[1] - P_R && y < b[3] + P_R);
}
const dist = (a, x, y) => Math.hypot(a.x - x, a.y - y);
function moveTo(w, x, y, speed, dt) {
  const d = Math.hypot(x - w.x, y - w.y);

      const d = Math.hypot(c.x - G.p.x, c.y - G.p.y);
      if (d > 130) {
        const a = Math.atan2(c.x - G.p.x, c.y - G.p.y);
        guide.visible = true;
        guide.position.set(G.p.x + Math.sin(a) * 68, 4, G.p.y + Math.cos(a) * 68);
        guide.rotation.set(PI / 2, a, 0);
      }
    }
  }

  /* Post-effektlar: yorqin nur, vinetka, rang */
  const webgl2 = renderer.capabilities.isWebGL2;
  let post = null;
  function makePost() {
    if (quality < 2 || !webgl2 || !T.WebGLMultisampleRenderTarget || !(renderer.extensions.get('EXT_color_buffer_float') || renderer.extensions.get('EXT_color_buffer_half_float'))) return null;
    const size = renderer.getDrawingBufferSize(new T.Vector2());
    const opts = { format: T.RGBAFormat, type: T.HalfFloatType, minFilter: T.LinearFilter, magFilter: T.LinearFilter };
    const main = new T.WebGLMultisampleRenderTarget(size.x, size.y, opts); main.samples = 4;
    const w = Math.max(2, size.x >> 2), h = Math.max(2, size.y >> 2);
    const a = new T.WebGLRenderTarget(w, h, Object.assign({ depthBuffer: false }, opts)), b = new T.WebGLRenderTarget(w, h, Object.assign({ depthBuffer: false }, opts));
    const quadScene = new T.Scene(), cam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1), quad = new T.Mesh(new T.PlaneGeometry(2, 2));
    quad.frustumCulled = false; quadScene.add(quad);
    const vert = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const bright = new T.ShaderMaterial({
      uniforms: { t: { value: main.texture } }, vertexShader: vert, depthTest: false, depthWrite: false,
      fragmentShader: 'uniform sampler2D t; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(1.5, 2.8, l), 1.0); }'
    });
    const blur = new T.ShaderMaterial({
      uniforms: { t: { value: null }, d: { value: new T.Vector2() } }, vertexShader: vert, depthTest: false, depthWrite: false,
      fragmentShader: 'uniform sampler2D t; uniform vec2 d; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb * 0.227; c += (texture2D(t, vUv + d * 1.38).rgb + texture2D(t, vUv - d * 1.38).rgb) * 0.316; c += (texture2D(t, vUv + d * 3.23).rgb + texture2D(t, vUv - d * 3.23).rgb) * 0.07; gl_FragColor = vec4(c, 1.0); }'
    });
    const out = new T.ShaderMaterial({
      uniforms: { t: { value: main.texture }, g: { value: a.texture } }, vertexShader: vert, depthTest: false, depthWrite: false,
      fragmentShader: `uniform sampler2D t; uniform sampler2D g; varying vec2 vUv;
        vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
        void main(){
          vec3 c = texture2D(t, vUv).rgb + texture2D(g, vUv).rgb * 0.3;
          c = aces(c * 0.62);
          c = pow(c, vec3(1.0 / 2.2));
          float l = dot(c, vec3(0.299, 0.587, 0.114));
          c = mix(vec3(l), c, 1.22);
          c *= vec3(1.02, 1.0, 0.97);
          vec2 p = vUv - 0.5;
          c *= 1.0 - dot(p, p) * 0.55;
          gl_FragColor = vec4(c, 1.0);
        }`
    });
    return {
      main, a, b, w, h,
      draw() {
        renderer.setRenderTarget(main); renderer.render(scene, camera);
        quad.material = bright; renderer.setRenderTarget(a); renderer.render(quadScene, cam);
        for (let i = 0; i < 2; i++) {
          const k = 1 + i * 1.6;
          quad.material = blur; blur.uniforms.t.value = a.texture; blur.uniforms.d.value.set(k / w, 0);
          renderer.setRenderTarget(b); renderer.render(quadScene, cam);
          blur.uniforms.t.value = b.texture; blur.uniforms.d.value.set(0, k / h);
          renderer.setRenderTarget(a); renderer.render(quadScene, cam);
        }
        renderer.setRenderTarget(null); quad.material = out; renderer.render(quadScene, cam);
      },
      dispose() { main.dispose(); a.dispose(); b.dispose(); bright.dispose(); blur.dispose(); out.dispose(); }
    };
  }

  /* Qoʻshimchalar: shahar ranglari, ichimlik mashinasi, oltin qop */
  const THEMES = [
    { floor: '#ffffff', wall: '#ffffff', rug: '#a8483c' }, { floor: '#dfe8f4', wall: '#8fb4ff', rug: '#2f5fa8' }, { floor: '#f4e6d0', wall: '#ffc98a', rug: '#a8742c' },
    { floor: '#e6f0e4', wall: '#a8e0b8', rug: '#2f8a5e' }, { floor: '#f4dfe6', wall: '#ffa8c4', rug: '#a83c6e' }, { floor: '#e6e0f4', wall: '#c4a8ff', rug: '#5e3ca8' }
  ];
  let themeOf = -1;
  const bag = new T.Group();
  const sack = ball(17, M.gold, 16); sack.scale.y = 1.05;
  bag.add(at(sack, 0, 18, 0), at(cyl(6, 9, 7, M.gold, 12), 0, 37, 0), at(blob(58, 58), 0, -bag.position.y + 1, 0));
  bag.visible = false; scene.add(bag);
  function makeSoda() {
    const g = at(new T.Group(), 660, 0, 470);
    g.add(rbox(58, 74, 44, 5, M.red, 0, 37, 0), rbox(46, 26, 3, 2, mat('#2a3442', { roughness: 0.2 }), 0, 54, 22), at(blob(100, 80), 0, 1, 0));
    [-13, 13].forEach(x => g.add(at(cyl(5, 4, 12, M.white, 12), x, 26, 24)));
    scene.add(g);
    return { g, tag: makeTag() };
  }
  function syncExtras() {
    const id = G.S.filial % THEMES.length;
    if (id !== themeOf) {
      themeOf = id; const c = THEMES[id];
      floorA.color.set(c.floor); floorB.color.set(c.floor); wainMat.color.set(c.wall);
      mat('#a8483c', { roughness: 0.9 }).color.set(c.rug);
    }
    if (has('soda') && !things.has('soda')) { const t = makeSoda(); things.set('soda', t); bounce(t.g); t.tag.set('Soda +40%', '#1f6b4a'); t.tag.s.position.set(660, 102, 470); }
    bag.visible = !!G.bag;
    if (G.bag) { bag.position.set(G.bag.x, 2 + Math.abs(Math.sin(performance.now() / 300)) * 8, G.bag.y); bag.rotation.y += 0.03; }
    if (YT) { $('ad').disabled = G.boost > 0; $('ad').textContent = G.boost > 0 ? 'x2 ' + Math.ceil(G.boost) + 's' : 'x2 Ad'; }
    $('goal').textContent = G.S.mission ? 'Goal: ' + missionText(G.S.mission) : '';
    $('rush').hidden = !(G.rush > 0);
    if (G.rush > 0) $('rush').textContent = 'RUSH HOUR x2 · ' + Math.ceil(G.rush) + 's';
  }

  /* Kamera */
  let camX = G.p.x, camZ = G.p.y;
  function fit3d() {
    const w = innerWidth, h = innerHeight, a = w / h;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = a; camera.updateProjectionMatrix();
    camera.userData.k = Math.max(0.95, Math.min(2.1, 1.1 / a));
    if (post) post.dispose();
    post = makePost();
  }
  camera.userData.k = 1;
  addEventListener('resize', fit3d);
  fit3d();
  function lowerQuality() {
    quality--;
    if (quality === 1) { if (post) post.dispose(); post = null; }
    if (quality === 0) { renderer.setPixelRatio(1); renderer.shadowMap.autoUpdate = false; renderer.setSize(innerWidth, innerHeight, false); }
  }
  let smokeT = 0, steamT = 0, dustT = 0, slow = 0, frames = 0;
  function particles(dt) {
    smokeT -= dt;
    if (smokeT <= 0) {
      smokeT = 0.32;
      chimneys.forEach(c => puff(c[0] + rnd(-3, 3), c[1], c[2], { color: '#f4efe6', life: 2.4, vx: rnd(6, 16), vy: 44, vz: rnd(-6, 6), s0: 14, s1: 58, op: 0.34 }));
    }
    steamT -= dt;
    if (steamT <= 0) {
      steamT = 0.45;
      G.tables.forEach(t => { if (t.on && t.busy) puff(t.x + rnd(-8, 8), 50, t.y + 10, { color: '#ffffff', life: 1.1, vy: 34, s0: 6, s1: 24, op: 0.4 }); });
    }
    motes.forEach(a => {
      if (!a.s.visible) return;
      a.t += dt / a.life;
      if (a.t >= 1) { a.s.visible = false; return; }
      a.s.position.x += a.vx * dt; a.s.position.y += a.vy * dt; a.s.position.z += a.vz * dt;
      const k = a.s0 + (a.s1 - a.s0) * a.t; a.s.scale.set(k, k, 1);
      a.s.material.opacity = a.op * Math.sin(a.t * PI);
    });
    let dirty = false;
    confData.forEach((d, i) => {
      if (d.t >= 1.6) return;
      dirty = true;
      d.t += dt; d.vy -= 620 * dt; d.vx *= 0.985; d.vz *= 0.985;
      d.x += d.vx * dt; d.y = Math.max(2, d.y + d.vy * dt); d.z += d.vz * dt; d.r += d.w * dt;
      tmp.position.set(d.x, d.y, d.z); tmp.rotation.set(d.r, d.r * 0.7, d.r * 0.4);
      tmp.scale.setScalar(d.t >= 1.6 ? 0 : 1); tmp.updateMatrix(); conf.setMatrixAt(i, tmp.matrix);
    });
    if (dirty) conf.instanceMatrix.needsUpdate = true;
  }
  function render(dt, now) {
    syncThings(); syncPeople(dt, now); syncPads(now);
    flames.forEach(f => {
      const k = calm ? 1 : 1 + Math.sin(now / 70 + f[2]) * 0.18 + Math.sin(now / 43 + f[2] * 2) * 0.1;
      f[0].scale.set(1, k, 1); f[1].scale.set(1, k * 1.1, 1); f[3].scale.set(1, 2 - k, 1);
    });
    glows.forEach((g, i) => { g.material.opacity = calm ? 0.34 : 0.32 + Math.sin(now / 110 + i) * 0.07; });
    lightPool.forEach((l, i) => { if (l.intensity > 0) l.intensity = 1.3 + (calm ? 0 : Math.sin(now / 90 + i * 2) * 0.28); });
    for (let i = pops3d.length - 1; i >= 0; i--) {
      const a = pops3d[i]; a.t = Math.min(1, a.t + dt * 2.6);
      const t = a.t, s = 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
      a.g.scale.setScalar(Math.max(0.01, s));
      if (a.t >= 1) { a.g.scale.setScalar(1); pops3d.splice(i, 1); }
    }
    flying.forEach(f => {
      if (f.t >= 1) { f.c.visible = false; return; }
      f.t += dt * 2.3;
      const k = Math.max(0, Math.min(1, f.t));
      f.c.position.set(f.x + (G.p.x - f.x) * k, f.y + (66 - f.y) * k + Math.sin(k * PI) * 70, f.z + (G.p.y - f.z) * k);
      f.c.rotation.x += dt * 13; f.c.rotation.z += dt * 7;
    });
    for (let i = texts.length - 1; i >= 0; i--) {
      const a = texts[i]; a.t += dt;
      a.s.position.y += dt * 50; a.s.material.opacity = Math.min(1, (1 - a.t) * 2);
      if (a.t >= 1) { scene.remove(a.s); a.s.material.map.dispose(); a.s.material.dispose(); texts.splice(i, 1); }
    }
    particles(dt);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
    const k = camera.userData.k;
    camX += (G.p.x - camX) * Math.min(1, dt * 4.5);
    camZ += (G.p.y - 40 - camZ) * Math.min(1, dt * 4.5);
    camera.position.set(camX, 960 * k, camZ + 800 * k);
    camera.lookAt(camX, 24, camZ - 14);
    sun.position.set(camX - 420, 780, camZ + 330);
    sun.target.position.set(camX, 0, camZ);
    if (!innerWidth || !innerHeight) return false;
    if (post) post.draw(); else renderer.render(scene, camera);
    return true;
  }

  let before = performance.now(), hudT = 1, running = true, readyStep = 0;
  function loop(now) {
    if (paused) { running = false; return; }
    const real = Math.max(0, (now - before) / 1000), dt = Math.min(0.05, real);
    before = now;
    if ($('up-sheet').hidden && $('away').hidden && $('start').hidden && $('daily').hidden) update(dt);
    const drawn = render(dt, now);
    // 0: kadr hali chizilmagan, 1: chizildi va ekranga chiqdi, 2: oʻyin bosishga tayyor
    if (YT && readyStep === 0 && drawn) readyStep = 1;
    else if (YT && readyStep === 1) { readyStep = 2; YT.game.firstFrameReady(); }
    else if (YT && readyStep === 2) {
      readyStep = 3; YT.game.gameReady(); checkAway(); checkDaily();
      if (cloudFailed) G.say('Cloud save is unavailable. Progress is not being saved.', false);
    }
    if (window.__quality === undefined && real < 1) {
      frames++; if (real > 0.03) slow++;
      if (frames >= 150) { if (slow > 90 && quality > 0) lowerQuality(); frames = 0; slow = 0; }
    }
    if ((hudT += dt) > 0.15) {
      hudT = 0;
      $('money').textContent = money(G.S.money);
      $('place').textContent = cityName() + ' · Rep ' + G.S.repLv + ' · ' + G.S.served + ' sold';
      const h = hintText();
      $('hint').textContent = h; $('hint').hidden = !h;
      if (!$('up-sheet').hidden) drawUps();
    }
    if (stick.on) {
      const a = $('stick'), b = $('knob');
      a.hidden = false;
      a.style.transform = 'translate(' + (stick.sx - 48) + 'px,' + (stick.sy - 48) + 'px)';
      b.style.transform = 'translate(' + (stick.x * 34) + 'px,' + (stick.y * 34) + 'px)';
    } else $('stick').hidden = true;
    requestAnimationFrame(loop);
  }
  G.resumeLoop = () => { if (!running) { running = true; before = performance.now(); requestAnimationFrame(loop); } };
  if (!YT) checkAway();
  requestAnimationFrame(loop);
}
</script>
